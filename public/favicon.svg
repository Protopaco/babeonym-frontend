<!--
  A copy of src/assets/icons/icon-baby.svg, not a reference to it. A favicon is
  loaded as a standalone document with no inherited colour, so the source
  asset's fill="currentColor" would resolve to black. That asset stays as it is
  because FloatingTutorialIcon inlines it through svgr and colours it from the
  theme; hardcoding a fill there would break it.

  Three things differ from the source:

  - The viewBox is square. The mark is 368.64x331.2, roughly 1.11:1, and a
    favicon is square, so it is padded rather than stretched.
  - The fills are explicit.
  - The mark sits on an opaque tile. On transparent the dark purple sinks into
    a dark tab strip, which would otherwise need a prefers-color-scheme swap;
    the tile carries its own background so the tab strip never shows through.

  The colour is the light theme's primary. It cannot follow the theme picker —
  the browser owns the tab, not the app — so it is fixed to the brand purple.

  This is a placeholder. The mark is a filled silhouette with fine interior
  detail and reads as a blob at 16px; a favicon that works at that size is a
  design task, not a scaling one.
-->
