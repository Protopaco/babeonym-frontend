<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babeonym</title>
    <!-- One head for every route: this is a single-page app. No canonical tag,
         because it would name the home page from /privacy too; the bare domain
         already redirects to www. og:image goes in once a 1200×630 preview
         image exists in public/. -->
    <meta
      name="description"
      content="Find a baby name you can agree on. Browse thousands of names by popularity, decade and language, see what they mean, and build your shortlist."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Babeonym" />
    <meta property="og:title" content="Babeonym" />
    <meta
      property="og:description"
      content="Find a baby name you can agree on. Browse thousands of names by popularity, decade and language, see what they mean, and build your shortlist."
    />
    <meta property="og:url" content="https://www.babeonym.com/" />
    <meta name="twitter:card" content="summary" />
    <!-- Paints the page in the theme's own background before React loads,
         instead of leaving the browser's white showing until the app mounts.
         Synchronous and in the head so it runs before the first paint.

         The colour is whatever the app stored on the last visit, so nothing
         about the palette is written here and nothing goes stale — a first-ever
         visit has nothing stored and still starts white. The key is
         themeBackground in src/constants/localStorageKeys.ts. -->
    <script>
      try {
        var themeBackground = localStorage.getItem('babeonym:themeBackground');
        if (themeBackground) {
          document.documentElement.style.background = themeBackground;
        }
      } catch (error) {
        // Storage can throw when site data is blocked. White is a fine fallback.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
